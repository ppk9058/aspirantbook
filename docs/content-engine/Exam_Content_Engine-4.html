 ar.forEach(x=>{const{i,r,u}=x,tp=r.top||topH(i.top),hi=Object.assign({},i,{q:r.q,o:r.o,e:null,exp:r.exp||""}),sb=r.exp?sents(r.exp):[],sib=ar.filter(y=>y!==x&&y.i.top===i.top).slice(0,5),qz=quiz(hi);

  if(x.ok)HT[i.url]=u,smh.push(u)});
 const ok=g=>g.some(x=>x.ok),sg=gb(ar,x=>x.i.sub);
 Object.entries(sg).forEach(([s,g])=>{const tg=gb(g,x=>x.i.top);
