version: '3.8'

services:
  postgres-test:
    image: postgres:15-alpine
    container_name: trillionskill-postgres-test
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: trillionskill_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d trillionskill_test"]
      interval: 2s
      timeout: 2s
      retries: 10
