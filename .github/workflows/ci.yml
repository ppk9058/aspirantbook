name: CI

on:
  push:
    branches:
      - main
      - feat/*
      - perf/*
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

  tsc-ratchet:
    name: TypeScript Ratchet Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Verify TypeScript ratchet
        run: node scripts/check-tsc-ratchet.mjs

  security-audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Audit root dependencies
        run: npm audit --audit-level=critical

      - name: Audit packages/shared dependencies
        run: cd packages/shared && npm audit --audit-level=critical

      - name: Audit apps/mobile dependencies
        run: cd apps/mobile && npm audit --audit-level=critical

  migrations-check:
    name: Database Migrations Check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_password
          POSTGRES_DB: trillionskill_migrations_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify strictly additive migrations
        run: node scripts/check-migrations-additive.mjs

      - name: Deploy migrations on fresh service database
        env:
          DATABASE_URL: "postgresql://postgres:postgres_password@localhost:5432/trillionskill_migrations_test"
          DIRECT_URL: "postgresql://postgres:postgres_password@localhost:5432/trillionskill_migrations_test"
        run: npx prisma migrate deploy

  test:
    name: Unit & Security Tests
    runs-on: ubuntu-latest
    # The test-database guard (lib/test-db-guard.ts) only accepts port 54329 for
    # 127.0.0.1, so the service is published on 54329 and DATABASE_URL/DIRECT_URL
    # below point at that port. Nothing here is a real secret.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_password
          POSTGRES_DB: trillionskill_test
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trillionskill_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test
      NODE_ENV: test
      AUTH_TRUST_HOST: "true"
      # Dummy CI-only value: long enough for next-auth, never a real secret.
      NEXTAUTH_SECRET: "ci-dummy-nextauth-secret-not-a-real-secret"
      DATABASE_URL: "postgresql://postgres:postgres_password@127.0.0.1:54329/trillionskill_test?connection_limit=10"
      DIRECT_URL: "postgresql://postgres:postgres_password@127.0.0.1:54329/trillionskill_test"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            if node -e "const net=require('net');const s=net.connect(54329,'127.0.0.1');s.on('connect',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))"; then
              echo "Postgres is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Postgres did not become ready in time" >&2
          exit 1

      - name: Apply schema to the test database
        run: npx prisma migrate deploy

      - name: Verify schema matches the migrations
        run: npx prisma migrate status

      - name: Run unit test suites
        run: npx tsx --test --test-concurrency=1 tests/unit/*.test.ts

  build:
    name: Production Next.js Build
    runs-on: ubuntu-latest
    needs: [lint, tsc-ratchet]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Next.js Production Build
        env:
          NEXT_PHASE: phase-production-build
          NODE_ENV: production
        run: npm run build

  docker-build:
    name: Docker Image Build
    runs-on: ubuntu-latest
    needs: [lint, tsc-ratchet]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push, no secrets)
        run: docker build -t trillionskill:ci -f Dockerfile .

  deploy-staging:
    name: Deploy to Staging (Disabled Stub)
    runs-on: ubuntu-latest
    if: false
    needs: [lint, tsc-ratchet, test, build, migrations-check, security-audit, docker-build]
    steps:
      - name: Staging Deploy Stub
        run: echo "Staging deploy is currently disabled in CI"

  deploy-prod:
    name: Deploy to Production (Disabled Stub)
    runs-on: ubuntu-latest
    if: false
    needs: [deploy-staging]
    steps:
      - name: Production Deploy Stub
        run: echo "Production deploy is currently disabled in CI"
