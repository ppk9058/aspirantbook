name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Code Quality
    runs-on: [self-hosted, mac-ci]
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

  check-launch-placeholders:
    name: Check Launch Placeholders
    runs-on: [self-hosted, mac-ci]
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check launch placeholders
        run: npm run check:launch-placeholders

  tsc-ratchet:
    name: TypeScript Ratchet Check
    runs-on: [self-hosted, mac-ci]
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Verify TypeScript ratchet
        run: node scripts/check-tsc-ratchet.mjs

  security-audit:
    name: Dependency Security Audit
    runs-on: [self-hosted, mac-ci]
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Audit root dependencies
        run: npm audit --audit-level=critical

      - name: Audit packages/shared dependencies
        run: cd packages/shared && npm audit --audit-level=critical

      - name: Audit apps/mobile dependencies
        run: cd apps/mobile && npm audit --audit-level=critical

  gitleaks:
    name: Secret Leak Detection (gitleaks)
    runs-on: [self-hosted, mac-ci]
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2.3.8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_REDACT: "true"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  migrations-check:
    name: Database Migrations Check
    runs-on: [self-hosted, mac-ci]
    timeout-minutes: 15
    steps:
      - name: Docker preflight
        run: |
          docker compose version
          docker info > /dev/null 2>&1 || { echo "Docker Desktop is not running on the runner Mac" >&2; exit 1; }

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Start test database container
        run: docker start trillionskill-test-db || npm run test:db:up

      - name: Wait for database container
        run: |
          for i in $(seq 1 30); do
            if docker exec trillionskill-test-db pg_isready -U postgres; then
              echo "Postgres is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Postgres did not become ready in time" >&2
          exit 1

      - name: Prepare fresh migrations database
        run: |
          docker exec trillionskill-test-db psql -U postgres -d postgres -c "DROP DATABASE IF EXISTS trillionskill_migrations_test WITH (FORCE);"
          docker exec trillionskill-test-db psql -U postgres -d postgres -c "CREATE DATABASE trillionskill_migrations_test;"

      - name: Verify strictly additive migrations
        run: node scripts/check-migrations-additive.mjs

      - name: Deploy migrations on fresh database
        env:
          DATABASE_URL: "postgresql://postgres:testpassword123@127.0.0.1:54329/trillionskill_migrations_test"
          DIRECT_URL: "postgresql://postgres:testpassword123@127.0.0.1:54329/trillionskill_migrations_test"
        run: npx prisma migrate deploy

      - name: Cleanup migrations database
        if: always()
        run: docker exec trillionskill-test-db psql -U postgres -d postgres -c "DROP DATABASE IF EXISTS trillionskill_migrations_test WITH (FORCE);"

  test:
    name: Unit & Security Tests
    runs-on: [self-hosted, mac-ci]
    timeout-minutes: 30
    # The test-database guard (lib/test-db-guard.ts) only accepts port 54329 for
    # 127.0.0.1. The database is the local Docker test container (trillionskill-test-db)
    # running on 127.0.0.1:54329 via npm run test:db:up.
    env:
      APP_ENV: test
      NODE_ENV: test
      AUTH_TRUST_HOST: "true"
      # Dummy CI-only value: long enough for next-auth, never a real secret.
      NEXTAUTH_SECRET: "ci-dummy-nextauth-secret-not-a-real-secret"
      DATABASE_URL: "postgresql://postgres:testpassword123@127.0.0.1:54329/trillionskill_test?connection_limit=10"
      DIRECT_URL: "postgresql://postgres:testpassword123@127.0.0.1:54329/trillionskill_test"

    steps:
      - name: Docker preflight
        run: |
          docker compose version
          docker info > /dev/null 2>&1 || { echo "Docker Desktop is not running on the runner Mac" >&2; exit 1; }

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Start test database container
        run: docker start trillionskill-test-db || npm run test:db:up

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            if node -e "const net=require('net');const s=net.connect(54329,'127.0.0.1');s.on('connect',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))"; then
              echo "Postgres is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Postgres did not become ready in time" >&2
          exit 1

      - name: Reset test database
        run: |
          docker exec trillionskill-test-db psql -U postgres -d postgres -c "DROP DATABASE IF EXISTS trillionskill_test WITH (FORCE);"
          docker exec trillionskill-test-db psql -U postgres -d postgres -c "CREATE DATABASE trillionskill_test;"

      - name: Apply schema to the test database
        run: npx prisma migrate deploy

      - name: Verify schema matches the migrations
        run: npx prisma migrate status

      # CI applies migrations but never seeds. course-metadata-db.test.ts (and
      # other suites) need at least one Course row, so seed the same service DB
      # on 127.0.0.1:54329 before running the suites.
      - name: Seed the test database
        run: npm run seed:test

      - name: Run unit test suites
        run: npx tsx --test --test-concurrency=1 tests/unit/*.test.ts

  build:
    name: Production Next.js Build
    runs-on: [self-hosted, mac-ci]
    timeout-minutes: 20
    needs: [lint, tsc-ratchet]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Next.js Production Build
        env:
          NEXT_PHASE: phase-production-build
          NODE_ENV: production
        run: npm run build

  docker-build:
    name: Docker Image Build
    runs-on: [self-hosted, mac-ci]
    timeout-minutes: 20
    needs: [lint, tsc-ratchet]
    steps:
      - name: Docker preflight
        run: |
          docker compose version
          docker info > /dev/null 2>&1 || { echo "Docker Desktop is not running on the runner Mac" >&2; exit 1; }

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image (no push, no secrets)
        run: docker build -t trillionskill:ci -f Dockerfile .

  deploy-staging:
    name: Deploy to Staging (Disabled Stub)
    runs-on: ubuntu-latest
    if: false
    needs: [lint, tsc-ratchet, test, build, migrations-check, security-audit, docker-build]
    steps:
      - name: Staging Deploy Stub
        run: echo "Staging deploy is currently disabled in CI"

  deploy-prod:
    name: Deploy to Production (Disabled Stub)
    runs-on: ubuntu-latest
    if: false
    needs: [deploy-staging]
    steps:
      - name: Production Deploy Stub
        run: echo "Production deploy is currently disabled in CI"
