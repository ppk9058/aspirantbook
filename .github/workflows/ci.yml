name: CI

on:
  push:
    branches:
      - main
      - feat/*
      - perf/*
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

  tsc-ratchet:
    name: TypeScript Ratchet Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Verify TypeScript ratchet
        run: node scripts/check-tsc-ratchet.mjs

  test:
    name: Unit & Security Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_password
          POSTGRES_DB: trillionskill_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Deploy database migrations
        env:
          DATABASE_URL: "postgresql://postgres:postgres_password@localhost:5432/trillionskill_test"
          DIRECT_URL: "postgresql://postgres:postgres_password@localhost:5432/trillionskill_test"
        run: npx prisma migrate deploy

      - name: Run unit test suites
        env:
          APP_ENV: test
          NODE_ENV: test
          DATABASE_URL: "postgresql://postgres:postgres_password@localhost:5432/trillionskill_test"
          DIRECT_URL: "postgresql://postgres:postgres_password@localhost:5432/trillionskill_test"
        run: npm run test:unit

  build:
    name: Production Next.js Build
    runs-on: ubuntu-latest
    needs: [lint, tsc-ratchet]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Next.js Production Build
        env:
          NEXT_PHASE: phase-production-build
          NODE_ENV: production
        run: npm run build
