<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="400" height="220">
    <defs>
      <linearGradient id="bg-Lakshya" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FEF3C7"/>
        <stop offset="100%" stop-color="#FDE68A"/>
      </linearGradient>
    </defs>
    <!-- Background -->
    <rect width="400" height="220" rx="16" fill="url(#bg-Lakshya)"/>
    
    <!-- Top Infinity Pro badge -->
    <g transform="translate(18, 14)">
      <circle cx="8" cy="8" r="8" fill="#F59E0B"/>
      <text x="22" y="12" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#1F2937">Multiple plans inside: <tspan font-weight="900">Infinity, Pro</tspan></text>
    </g>

    <!-- WhatsApp Share Icon in top right -->
    <g transform="translate(360, 12)">
      <circle cx="12" cy="12" r="14" fill="#FFFFFF" opacity="0.9"/>
      <path d="M7 17 L8 13.5 A5 5 0 1 1 14 17 L7 17" fill="#25D366" stroke="#25D366" stroke-width="1.5"/>
      <path d="M10 10 Q11 12 13 14" stroke="#FFF" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- Main Title Banner in Bold Poster Font -->
    <g transform="translate(200, 70)" text-anchor="middle">
      <text y="0" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="900" fill="#0F172A" letter-spacing="-0.5">LAKSHYA 2.0 2027</text>
      <rect x="-70" y="10" width="140" height="20" rx="4" fill="#3B82F6"/>
      <text y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">BOARDS BATCH</text>
    </g>

    <!-- Mentor / Teacher Avatars Row standing together -->
    <g transform="translate(20, 110)">
      <!-- 5 Faculty Teachers representation -->
      <!-- Teacher 1 -->
      <g transform="translate(40, 40)">
        <circle cx="20" cy="15" r="14" fill="#F3D5B5"/>
        <path d="M6 15 Q20 5 34 15 Q28 8 20 8 Q12 8 6 15" fill="#1F2937"/>
        <path d="M5 45 C5 25 35 25 35 45 Z" fill="#1E1B2E"/>
        <circle cx="16" cy="14" r="2" fill="#111"/>
        <circle cx="24" cy="14" r="2" fill="#111"/>
        <path d="M17 19 Q20 22 23 19" stroke="#991B1B" stroke-width="1.5" fill="none"/>
      </g>
      <!-- Teacher 2 (Center Lead) -->
      <g transform="translate(100, 30)">
        <circle cx="20" cy="15" r="16" fill="#F3D5B5"/>
        <path d="M4 14 Q20 2 36 14 Q28 6 20 6 Q12 6 4 14" fill="#111827"/>
        <path d="M2 55 C2 28 38 28 38 55 Z" fill="#111827"/>
        <circle cx="15" cy="14" r="2" fill="#111"/>
        <circle cx="25" cy="14" r="2" fill="#111"/>
        <!-- Glasses -->
        <circle cx="15" cy="14" r="4.5" fill="none" stroke="#333" stroke-width="1.2"/>
        <circle cx="25" cy="14" r="4.5" fill="none" stroke="#333" stroke-width="1.2"/>
        <line x1="19.5" y1="14" x2="20.5" y2="14" stroke="#333" stroke-width="1.2"/>
        <path d="M17 21 Q20 25 23 21" stroke="#991B1B" stroke-width="1.5" fill="none"/>
      </g>
      <!-- Teacher 3 (Female Mentor) -->
      <g transform="translate(160, 35)">
        <circle cx="20" cy="15" r="14" fill="#E8B08B"/>
        <path d="M3 25 C0 8 40 8 37 25 C33 10 7 10 3 25" fill="#18181B"/>
        <path d="M5 50 C5 26 35 26 35 50 Z" fill="#18181B"/>
        <circle cx="16" cy="14" r="1.8" fill="#111"/>
        <circle cx="24" cy="14" r="1.8" fill="#111"/>
        <path d="M17 19 Q20 22 23 19" stroke="#DC2626" stroke-width="1.5" fill="none"/>
      </g>
      <!-- Teacher 4 -->
      <g transform="translate(220, 38)">
        <circle cx="20" cy="15" r="14" fill="#F3D5B5"/>
        <path d="M6 14 Q20 5 34 14 Q28 7 20 7 Q12 7 6 14" fill="#111"/>
        <path d="M5 47 C5 26 35 26 35 47 Z" fill="#1F2937"/>
        <circle cx="16" cy="14" r="2" fill="#111"/>
        <circle cx="24" cy="14" r="2" fill="#111"/>
        <path d="M17 20 Q20 23 23 20" stroke="#991B1B" stroke-width="1.5" fill="none"/>
      </g>
      <!-- Teacher 5 -->
      <g transform="translate(280, 42)">
        <circle cx="20" cy="15" r="13" fill="#F3D5B5"/>
        <path d="M7 14 Q20 6 33 14 Q27 8 20 8 Q13 8 7 14" fill="#222"/>
        <path d="M6 43 C6 25 34 25 34 43 Z" fill="#111827"/>
        <circle cx="16" cy="14" r="1.8" fill="#111"/>
        <circle cx="24" cy="14" r="1.8" fill="#111"/>
        <path d="M17 19 Q20 22 23 19" stroke="#991B1B" stroke-width="1.5" fill="none"/>
      </g>
    </g>
  </svg>