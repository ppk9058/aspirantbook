<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bpsc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e"/>
      <stop offset="40%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#115e59"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bpsc-bg)"/>

  <!-- Decorative Rings -->
  <circle cx="700" cy="80" r="180" fill="#2dd4bf" opacity="0.15" filter="blur(40px)"/>
  <circle cx="100" cy="380" r="150" fill="#fbbf24" opacity="0.12" filter="blur(40px)"/>

  <!-- Top Badge -->
  <g transform="translate(50, 45)">
    <rect width="180" height="34" rx="17" fill="#fbbf24" opacity="0.95"/>
    <text x="90" y="22" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="900" fill="#1e1b4b" letter-spacing="1">72nd BPSC 2026</text>
  </g>

  <!-- Big Central Typography Banner -->
  <g transform="translate(50, 160)">
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="-0.5">CURRENT AFFAIRS &amp; BIHAR SPECIAL</text>
    <text x="0" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#99f6e4">Monthly Coverage &#8226; Economic Survey &#8226; Bihar Budget &#8226; GK Drill</text>
  </g>

  <!-- Bottom Details Bar -->
  <g transform="translate(50, 370)">
    <rect width="700" height="46" rx="12" fill="#000000" opacity="0.3"/>
    <text x="25" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Verified Civil Services Faculty &#8226; Bilingual English/Hindi &#8226; Chapter PDF Notes</text>
  </g>
</svg>
