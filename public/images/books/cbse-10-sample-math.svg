<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 780" width="100%" height="100%">
  <rect width="600" height="780" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="25" y="25" width="550" height="40" fill="#d97706" rx="4"/>
  <text x="300" y="50" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">SECTION B - MATHEMATICS (STANDARD)</text>
  <text x="40" y="100" fill="#0f172a" font-family="sans-serif" font-size="13" font-weight="bold">Q. Prove that √5 is an irrational number. [CBSE 2026 Set 30/1/1 &bull; 3 Marks]</text>
  <rect x="40" y="120" width="520" height="150" rx="4" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="55" y="145" fill="#92400e" font-family="sans-serif" font-size="12" font-weight="bold">Step-by-Step Proof by Contradiction:</text>
  <text x="55" y="168" fill="#78350f" font-family="sans-serif" font-size="11.5">1. Let us assume, to the contrary, that √5 is rational.</text>
  <text x="55" y="188" fill="#78350f" font-family="sans-serif" font-size="11.5">2. Then √5 = a/b, where a and b are co-prime integers and b ≠ 0.</text>
  <text x="55" y="208" fill="#78350f" font-family="sans-serif" font-size="11.5">3. Squaring both sides: 5 = a²/b² ⇒ 5b² = a² (Therefore, 5 divides a² ⇒ 5 divides a).</text>
  <text x="55" y="228" fill="#78350f" font-family="sans-serif" font-size="11.5">4. Let a = 5c. Then 5b² = 25c² ⇒ b² = 5c² (5 divides b² ⇒ 5 divides b).</text>
  <text x="55" y="248" fill="#78350f" font-family="sans-serif" font-size="11.5">5. Thus a and b have at least 5 as a common factor, which contradicts co-primality. Hence √5 is irrational.</text>
</svg>