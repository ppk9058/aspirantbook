<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 780" width="100%" height="100%">
  <rect width="600" height="780" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="25" y="25" width="550" height="40" fill="#6d28d9" rx="4"/>
  <text x="300" y="50" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">OFFICIAL CBSE MARKING SCHEME GUIDELINES</text>
  <rect x="40" y="90" width="520" height="120" rx="6" fill="#faf5ff" stroke="#d8b4fe"/>
  <text x="55" y="115" fill="#6b21a8" font-family="sans-serif" font-size="13" font-weight="bold">Examiner's Note on Point-Wise Answering:</text>
  <text x="55" y="140" fill="#581c87" font-family="sans-serif" font-size="11.5">1. Always underline keywords and final numerical answers with units.</text>
  <text x="55" y="162" fill="#581c87" font-family="sans-serif" font-size="11.5">2. In Science, draw neat labeled diagrams wherever applicable for 3 and 5 marks questions.</text>
  <text x="55" y="184" fill="#581c87" font-family="sans-serif" font-size="11.5">3. Avoid writing lengthy essays in Social Science; format in bullet points.</text>
</svg>