<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="100%" height="100%">
  <defs>
    <linearGradient id="coverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2b38"/>
      <stop offset="40%" stop-color="#144253"/>
      <stop offset="100%" stop-color="#0b1b24"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f6d365"/>
      <stop offset="100%" stop-color="#fda085"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="4" dy="6" stdDeviation="6" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Book Spine 3D Effect -->
  <rect x="10" y="10" width="380" height="540" rx="8" fill="url(#coverGrad)" filter="url(#shadow)"/>
  <rect x="10" y="10" width="22" height="540" fill="#09151c" opacity="0.45"/>
  <line x1="32" y1="10" x2="32" y2="550" stroke="#2a576b" stroke-width="2"/>

  <!-- PW / Publisher Badge -->
  <circle cx="65" cy="55" r="20" fill="#000" stroke="#f6d365" stroke-width="2"/>
  <text x="65" y="61" fill="#fff" font-family="Arial, sans-serif" font-weight="900" font-size="14" text-anchor="middle">PW</text>

  <rect x="270" y="40" width="100" height="26" rx="4" fill="#f59e0b"/>
  <text x="320" y="58" fill="#111" font-family="Arial, sans-serif" font-weight="bold" font-size="12" text-anchor="middle">2027 Edition</text>

  <!-- Title & Heading -->
  <text x="65" y="115" fill="#38bdf8" font-family="Arial, sans-serif" font-weight="800" font-size="18" letter-spacing="1">CBSE</text>
  <text x="65" y="150" fill="#ffffff" font-family="Arial, sans-serif" font-weight="900" font-size="28" letter-spacing="2">CLASS 10</text>

  <!-- Big 10 Years Badge -->
  <g transform="translate(65, 175)">
    <rect x="0" y="0" width="260" height="42" rx="4" fill="#0284c7"/>
    <text x="130" y="27" fill="#ffffff" font-family="Arial, sans-serif" font-weight="800" font-size="15" text-anchor="middle" letter-spacing="1">PAST 10 YEARS SOLVED PAPERS</text>
  </g>

  <text x="200" y="325" fill="url(#goldGrad)" font-family="Arial, sans-serif" font-weight="900" font-size="100" text-anchor="middle" opacity="0.95">10</text>
  <text x="200" y="355" fill="#ffffff" font-family="Arial, sans-serif" font-weight="800" font-size="20" text-anchor="middle" letter-spacing="4">YEARS'</text>
  <text x="200" y="375" fill="#38bdf8" font-family="Arial, sans-serif" font-weight="600" font-size="13" text-anchor="middle">(2026 - 2017)</text>

  <!-- Subject Pills -->
  <g transform="translate(45, 410)">
    <rect x="0" y="0" width="70" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="35" y="18" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Science</text>

    <rect x="78" y="0" width="70" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="113" y="18" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Maths</text>

    <rect x="156" y="0" width="70" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="191" y="18" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Social Sci</text>

    <rect x="234" y="0" width="70" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="269" y="18" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">English</text>
  </g>

  <!-- Bottom Details -->
  <rect x="35" y="470" width="330" height="50" rx="6" fill="#0a1922" stroke="#1d4ed8" stroke-width="1"/>
  <text x="200" y="492" fill="#facc15" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">DELHI &amp; OUTSIDE DELHI MULTIPLE SETS</text>
  <text x="200" y="508" fill="#94a3b8" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Includes NCERT Page References &amp; Step-by-Step Marking</text>
</svg>
