<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 780" width="100%" height="100%">
  <rect width="600" height="780" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="25" y="25" width="550" height="40" fill="#059669" rx="4"/>
  <text x="300" y="50" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">SECTION C - SOCIAL SCIENCE (POLITICAL SCIENCE)</text>
  <text x="40" y="100" fill="#0f172a" font-family="sans-serif" font-size="13" font-weight="bold">Q. Explain the power-sharing arrangement in Belgium. [CBSE 2026 Set 32/1/1 &bull; 5 Marks]</text>
  <rect x="40" y="120" width="520" height="160" rx="4" fill="#f0fdf4" stroke="#86efac"/>
  <text x="55" y="145" fill="#166534" font-family="sans-serif" font-size="12" font-weight="bold">Key Model Answer Points (Marking Scheme):</text>
  <text x="55" y="168" fill="#15803d" font-family="sans-serif" font-size="11.5">&bull; Equal representation for Dutch and French-speaking ministers in Central Government.</text>
  <text x="55" y="190" fill="#15803d" font-family="sans-serif" font-size="11.5">&bull; Many powers of the Central Government were given to State Governments of the two regions.</text>
  <text x="55" y="212" fill="#15803d" font-family="sans-serif" font-size="11.5">&bull; Brussels has a separate government in which both communities have equal representation.</text>
  <text x="55" y="234" fill="#15803d" font-family="sans-serif" font-size="11.5">&bull; 'Community Government' elected by people belonging to one language community.</text>
  <text x="55" y="256" fill="#15803d" font-family="sans-serif" font-size="11.5">[NCERT Class 10 Political Science Chapter 1 - Page 4-5]</text>
</svg>