<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 780" width="100%" height="100%">
  <rect width="600" height="780" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="25" y="25" width="550" height="40" fill="#0284c7" rx="4"/>
  <text x="300" y="50" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">SECTION A - SCIENCE (PHYSICS &amp; CHEMISTRY)</text>
  <text x="40" y="100" fill="#0f172a" font-family="sans-serif" font-size="13" font-weight="bold">Q1. Why does calcium start floating when it reacts with water?</text>
  <text x="40" y="125" fill="#475569" font-family="sans-serif" font-size="12">[CBSE 2026 Delhi Set 31/1/1 &bull; 1 Mark]</text>
  <rect x="40" y="140" width="520" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
  <text x="55" y="165" fill="#166534" font-family="sans-serif" font-size="12" font-weight="bold">Answer:</text>
  <text x="55" y="185" fill="#15803d" font-family="sans-serif" font-size="11.5">Calcium reacts with water less violently. The bubbles of hydrogen gas produced stick to the</text>
  <text x="55" y="202" fill="#15803d" font-family="sans-serif" font-size="11.5">surface of the metal, causing it to float. [NCERT Chemistry Page 43]</text>

  <text x="40" y="250" fill="#0f172a" font-family="sans-serif" font-size="13" font-weight="bold">Q2. State Snell's law of refraction of light. Write its mathematical form.</text>
  <text x="40" y="275" fill="#475569" font-family="sans-serif" font-size="12">[CBSE 2025 Outside Delhi &bull; 2 Marks]</text>
  <rect x="40" y="290" width="520" height="95" rx="4" fill="#f0fdf4" stroke="#86efac"/>
  <text x="55" y="315" fill="#166534" font-family="sans-serif" font-size="12" font-weight="bold">Answer:</text>
  <text x="55" y="335" fill="#15803d" font-family="sans-serif" font-size="11.5">The ratio of sine of angle of incidence to the sine of angle of refraction is a constant</text>
  <text x="55" y="355" fill="#15803d" font-family="sans-serif" font-size="11.5">for the light of a given colour and for the given pair of media: sin i / sin r = constant.</text>
  <text x="55" y="375" fill="#15803d" font-family="sans-serif" font-size="11.5">[NCERT Physics Light Chapter - Page 174]</text>
</svg>