<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="40%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#042f2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.06"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#grid)"/>

  <!-- Glowing background circles -->
  <circle cx="720" cy="100" r="160" fill="#2dd4bf" opacity="0.25" filter="blur(50px)"/>
  <circle cx="100" cy="380" r="140" fill="#38bdf8" opacity="0.2" filter="blur(40px)"/>

  <!-- Center Icon & Brand Badge -->
  <g transform="translate(400, 190)">
    <!-- Play/Course Icon -->
    <rect x="-40" y="-40" width="80" height="80" rx="24" fill="#ffffff" opacity="0.15"/>
    <rect x="-38" y="-38" width="76" height="76" rx="22" stroke="#5eead4" stroke-width="2" fill="none" opacity="0.6"/>
    <path d="M-8 -14 L16 0 L-8 14 Z" fill="#5eead4"/>

    <!-- Course Badge -->
    <rect x="-70" y="60" width="140" height="28" rx="14" fill="#ffffff" opacity="0.2"/>
    <text x="0" y="78" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#ffffff" letter-spacing="1">VIDEO COURSE</text>

    <!-- Platform Name -->
    <text x="0" y="125" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" fill="#ffffff" letter-spacing="0.5">aspirantbook</text>
    <text x="0" y="148" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#99f6e4">Comprehensive Interactive Courseware</text>
  </g>
</svg>